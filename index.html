<title>時間割検索｜ログイン</title>
<style>
:root{color-scheme:light;--bg:#f6f7fb;--text:#1b2233;--muted:#5e6a85;--accent:#2d5bff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text)}
#login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:22px}
.card{width:min(100%,420px);padding:30px 26px;background:#fff;border:1px solid #d7dbe7;border-radius:18px;box-shadow:0 10px 30px rgba(28,42,89,.07)}
.password-notice{margin:0 0 18px;padding:11px 12px;border:1px solid #b9c9ff;border-radius:10px;background:#eef3ff;color:#234bc5;font-size:14px;font-weight:700;line-height:1.6}
h1{font-size:23px;margin:0 0 10px}
.description{font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 25px}
label{font-size:14px;font-weight:700}
.password-row{display:flex;margin-top:8px;gap:8px}
input{min-width:0;flex:1;height:46px;border:1px solid #b8c0d6;border-radius:10px;padding:0 12px;font-size:16px}
button{font:inherit;cursor:pointer;border-radius:10px}
button:disabled{cursor:wait;opacity:.65}
.secondary{border:1px solid #b8c0d6;background:#fff;color:var(--text);padding:0 12px}
#unlock{width:100%;margin-top:17px;height:46px;background:var(--accent);color:#fff;border:0;font-weight:700}
#status{margin:15px 0 0;min-height:2.8em;font-size:13px;line-height:1.6;color:#ad2238}
.private-note{margin:6px 0 0;font-size:12px;line-height:1.6;color:var(--muted)}
 .app-bar{min-height:56px;padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-bottom:1px solid #d7dbe7;position:sticky;top:0;z-index:1}
.app-bar .app-title{font-size:14px;font-weight:700;white-space:nowrap}
.app-actions{display:flex;flex-wrap:wrap;gap:8px;max-width:100%}
.app-actions button{padding:8px 10px;font-size:13px;white-space:nowrap}
#compare[aria-pressed="true"]{border-color:var(--accent);background:#eef3ff;color:#263a74}
#frame-container{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;background:#d7dbe7}
.screen-panel{min-width:0;background:var(--bg)}
.screen-heading{display:none;height:32px;margin:0;padding:0 14px;align-items:center;font-size:13px;font-weight:700;color:var(--muted);background:#fff;border-bottom:1px solid #d7dbe7}
iframe{display:block;width:100%;height:calc(100vh - var(--bar-height,56px));height:calc(100dvh - var(--bar-height,56px));border:0;background:var(--bg)}
#app.comparing #frame-container{grid-template-columns:repeat(2,minmax(0,1fr))}
#app.comparing .screen-heading{display:flex}
#app.comparing iframe{height:calc(100vh - var(--bar-height,56px) - 32px);height:calc(100dvh - var(--bar-height,56px) - 32px)}
@media(max-width:760px){#app.comparing #frame-container{grid-template-columns:minmax(0,1fr)}}
.pdf-dialog{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(20,30,55,.5)}
.pdf-card{background:#fff;border-radius:16px;padding:22px;max-width:440px;width:100%;display:grid;gap:10px}
.pdf-card h2{font-size:18px;margin:0}
.pdf-card p{font-size:13px;line-height:1.6;margin:0;word-break:break-word}
.pdf-card button,.pdf-card a{padding:11px;text-align:center;font-size:14px;border-radius:10px}
.pdf-card a{background:var(--accent);color:#fff;text-decoration:none}
:focus-visible{outline:3px solid #90a8ff;outline-offset:3px}

#home{border:0;background:transparent;color:var(--text);padding:7px 0;text-align:left}
#home:hover{color:var(--accent)}
#shared-tools{padding:8px;background:var(--bg);border-bottom:1px solid #d7dbe7}
#shared-tools iframe{height:136px}
#app.comparing #frame-container{align-items:start;gap:8px;padding:8px;background:var(--bg)}
#app.comparing iframe{height:900px}
#app.comparing .screen-panel{border:1px solid #d7dbe7;border-radius:12px;overflow:hidden}
#app.comparing .screen-heading{height:30px}
#app-menu{position:relative}
#app-menu summary{list-style:none;cursor:pointer;padding:6px 9px;font-size:20px;line-height:1;border:1px solid #b8c0d6;border-radius:9px}
#app-menu summary::-webkit-details-marker{display:none}
.app-menu-body{position:absolute;right:0;top:calc(100% + 6px);padding:8px;background:#fff;box-shadow:0 6px 20px #1b223322;border:1px solid #d7dbe7;border-radius:10px;z-index:3;width:190px}
.app-menu-body button{width:100%;font-size:12px}
.install-login{display:block;padding:8px 10px;margin-top:16px;font-size:13px}
#offline-status{margin:0;padding:7px 12px;font-size:12px;background:#fff4cf;color:#805700}
@media(max-width:760px){
 .app-bar{padding:6px 8px;gap:5px;flex-wrap:nowrap}
 .app-bar .app-title{font-size:12px}
 .app-actions{gap:4px;flex-wrap:nowrap}
 .app-actions button{font-size:11px;padding:7px 6px}
 #app-menu summary{padding:5px 6px;font-size:18px}
 #app.comparing #frame-container{padding:5px;gap:8px}
 #shared-tools{padding:5px}
}
#comparison-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:7px 10px;background:var(--bg)}
#comparison-pdf{padding:9px 12px;font-size:13px;color:#234bc5;border-color:#5477ef;background:#f1f5ff;font-weight:700}
#comparison-pdf:disabled{cursor:default;opacity:.5}
#comparison-pdf-status{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main id="login">
  <section class="card" aria-labelledby="login-title">
    <p class="password-notice">パスワードは、今までと同じです</p>
    <h1 id="login-title">時間割検索</h1>
    <p class="description">閲覧にはパスワードが必要です。<br>案内されたパスワードを入力してください。</p>
    <form id="login-form" action="#" autocomplete="off">
      <label for="password">パスワード</label>
      <div class="password-row">
        <input id="password" type="password" disabled required autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="status">
        <button id="show-password" class="secondary" type="button" disabled aria-pressed="false" aria-controls="password">表示</button>
      </div>
      <button id="unlock" type="submit" disabled>時間割を開く</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="private-note">パスワードや時間割を外部に共有しないでください。<br>30分間操作がない場合は、自動でログアウトします。</p>
    <noscript><p>このサイトの利用にはJavaScriptを有効にしてください。</p></noscript>
    <button id="install-login" class="secondary install-login" type="button">ホーム画面に追加</button>
    <p id="offline-ready" class="private-note"></p>
  </section>
</main>
<p id="offline-status" role="status" hidden></p>
<section id="app" hidden>
  <div class="app-bar">
    <button id="home" class="app-title" type="button" aria-label="ホームに戻る">時間割検索</button>
    <div class="app-actions">
      <button id="compare" class="secondary" type="button" aria-pressed="false" aria-controls="frame-container">2画面で比較</button>
      <button id="differences" class="secondary" type="button" aria-pressed="true" hidden>差分表示</button>
      <button id="logout" class="secondary" type="button">ログアウト</button>
      <details id="app-menu"><summary aria-label="メニュー">⋯</summary><div class="app-menu-body"><button id="install-app" class="secondary" type="button">ホーム画面に追加</button></div></details>
    </div>
  </div>
  <section id="shared-tools" aria-label="比較で共通の検索ツール" hidden></section>
  <div id="comparison-actions" hidden><button id="comparison-pdf" class="secondary" type="button" disabled>2つの時間割をPDF保存</button><span id="comparison-pdf-status" role="status"></span></div>
  <div id="frame-container"></div>
</section>

  const iv = decode(payload.iv, 12);
  const ciphertext = decode(payload.ciphertext);
  const material = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name: 'PBKDF2', hash: 'SHA-256', salt, iterations: payload.iterations},
    material, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const plaintext = await crypto.subtle.decrypt(
    {name: 'AES-GCM', iv, tagLength: 128}, key, ciphertext);
  return new TextDecoder('utf-8', {fatal: true}).decode(plaintext);
}

const preferenceCrypto = (() => {
  const to64=bytes=>{const values=new Uint8Array(bytes);let binary='';for(let i=0;i<values.length;i+=8192)binary+=String.fromCharCode(...values.subarray(i,i+8192));return btoa(binary);};
  const from64=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
  const empty=()=>({favorites:[],recent:[],bells:{}});
  async function open(password,envelope) {
    if(envelope && (envelope.version!==1||envelope.iterations!==600000||typeof envelope.salt!=='string'||typeof envelope.iv!=='string'||typeof envelope.ciphertext!=='string'))throw new Error('Invalid saved preferences');
    const salt=envelope?from64(envelope.salt):crypto.getRandomValues(new Uint8Array(16));
    if(salt.length!==16)throw new Error('Invalid saved salt');
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:600000},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
    let preferences=empty();
    if(envelope){
      const iv=from64(envelope.iv);if(iv.length!==12)throw new Error('Invalid saved nonce');
      const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv,tagLength:128},key,from64(envelope.ciphertext));
      const parsed=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(plaintext));
      if(!Array.isArray(parsed.favorites)||!Array.isArray(parsed.recent)||!parsed.bells||typeof parsed.bells!=='object')throw new Error('Invalid saved contents');
      preferences={favorites:parsed.favorites.filter(x=>typeof x==='string'&&x.length<300).slice(0,500),recent:parsed.recent.filter(x=>typeof x==='string'&&x.length<300).slice(0,5),bells:parsed.bells};
    }
    return {key,salt:to64(salt),preferences};
  }
  async function seal(session,preferences) {
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ciphertext=await crypto.subtle.encrypt({name:'AES-GCM',iv,tagLength:128},session.key,new TextEncoder().encode(JSON.stringify(preferences)));
    return {version:1,iterations:600000,salt:session.salt,iv:to64(iv),ciphertext:to64(ciphertext)};
  }
  function update(previous,change) {
    const preferences=structuredClone(previous);
    const key=typeof change?.key==='string'&&change.key.length<300&&/^(teacher|class):/.test(change.key)?change.key:null;
    if(change?.type==='favorite'&&key){
      preferences.favorites=preferences.favorites.filter(x=>x!==key);
      if(change.enabled&&preferences.favorites.length<500)preferences.favorites.push(key);
    }else if(change?.type==='recent'&&key)preferences.recent=[key,...preferences.recent.filter(x=>x!==key)].slice(0,5);
    else if(change?.type==='clear'){preferences.favorites=[];preferences.recent=[];}
    else if(change?.type==='bells'&&['high','middle','highSat','middleSat'].includes(change.mode)){
      if(change.value===null)delete preferences.bells[change.mode];
      else if(Array.isArray(change.value)&&change.value.length===7){
        let previousEnd=-1;
        for(const times of change.value){
          if(times===null)continue;
          if(!Array.isArray(times)||times.length!==2||!times.every(x=>typeof x==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(x)))return previous;
          const toMinute=x=>Number(x.slice(0,2))*60+Number(x.slice(3));
          const start=toMinute(times[0]),end=toMinute(times[1]);
          if(end<=start||start<previousEnd)return previous;
          previousEnd=end;
        }
        preferences.bells[change.mode]=change.value;
      }
    }
    return preferences;
  }
  return {open,seal,update,empty};
})();

// PDF object/xref writer adapted from aykuno/exam.kyoutu.selfcheck.
function makeTimetablePdf(raster,options={}) {
  const pages=options.pages||[{raster,width:options.width||1240,height:options.height||1754,encoding:options.encoding||'jpeg'}];
  if(!Array.isArray(pages)||pages.length<1||pages.length>2)throw Error('Invalid page count');
  for(const page of pages){
    const {width,height,encoding}=page;
    if(!(page.raster instanceof Uint8Array)||!Number.isInteger(width)||!Number.isInteger(height)||width<1||height<1||width*height>10000000)throw Error('Invalid raster dimensions');
    if(encoding!=='jpeg'&&encoding!=='rgb-deflate')throw Error('Unsupported raster encoding');
  }
  const ascii=text=>Uint8Array.from(text,c=>c.charCodeAt(0)&255);
  const hexText=text=>'FEFF'+Array.from({length:text.length},(_,i)=>text.charCodeAt(i).toString(16).padStart(4,'0')).join('').toUpperCase();
  const pdfW=595.275590551,pdfH=841.88976378,parts=[],offsets=[0];let length=0;
  function add(part){if(typeof part==='string'||typeof part==='number')part=ascii(String(part));parts.push(part);length+=part.byteLength;}
  function obj(n,body){offsets[n]=length;add(n+' 0 obj\n');body.forEach(add);add('\nendobj\n');}
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,['<< /Type /Catalog /Pages 2 0 R /ViewerPreferences << /DisplayDocTitle true >> >>']);
  obj(2,['<< /Type /Pages /Kids [',pages.map((_,i)=>(3+i*3)+' 0 R').join(' '),'] /Count ',pages.length,' >>']);
  pages.forEach((page,i)=>{
    const number=3+i*3;
    obj(number,['<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ',pdfW.toFixed(3),' ',pdfH.toFixed(3),'] /Resources << /XObject << /Im1 ',number+2,' 0 R >> >> /Contents ',number+1,' 0 R >>']);
    const stream='q\n'+pdfW.toFixed(3)+' 0 0 '+pdfH.toFixed(3)+' 0 0 cm\n/Im1 Do\nQ\n';
    obj(number+1,['<< /Length ',String(ascii(stream).length),' >>\nstream\n',stream,'endstream']);
    obj(number+2,['<< /Type /XObject /Subtype /Image /Width ',page.width,' /Height ',page.height,' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Interpolate false /Filter /',page.encoding==='rgb-deflate'?'FlateDecode':'DCTDecode',' /Length ',page.raster.byteLength,' >>\nstream\n',page.raster,'\nendstream']);
  });
  const info=3+pages.length*3;
  obj(info,['<< /Title <',hexText(String(options.title||'2026時間割')),'> /Producer (Ichigaku timetable) >>']);
  const count=info+1,xref=length;add('xref\n0 '+count+'\n0000000000 65535 f \n');
  for(let i=1;i<count;i++)add(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
  add('trailer\n<< /Size '+count+' /Root 1 0 R /Info '+info+' 0 R >>\nstartxref\n'+xref+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}

      if((raster[0]&15)!==8||((raster[0]<<8)|raster[1])%31!==0)return null;
    }else return null;
    return {raster,width,height,encoding};
  }
  function closePdf(){
    document.getElementById('pdf-dialog')?.remove();
    if(activePdf){
      URL.revokeObjectURL(activePdf.url);
      if(activePdf.namedUrl)navigator.serviceWorker?.controller?.postMessage({type:'timetable-release-pdf',url:activePdf.namedUrl});
    }
    activePdf=null;
  }
  function showPdf(data){
    const page=validateRaster(data);if(!page)return;
    const filename=data.item?pdfFilename([data.item],data.exportedAt||Date.now()):String(data.filename||'2026時間割.pdf').replace(/[\\/:*?"<>|\r\n]/g,'_').slice(0,180);
    const blob=makeTimetablePdf(page.raster,{...page,title:filename.replace(/\.pdf$/,'')});
    showPdfFile(blob,filename);
  }
  function showPdfFile(blob,filename) {
    closePdf();
    activePdf={blob,filename,url:URL.createObjectURL(new File([blob],filename,{type:'application/pdf'}))};
    const dialog=document.createElement('div');dialog.id='pdf-dialog';dialog.className='pdf-dialog';
    dialog.innerHTML='<section class="pdf-card" role="dialog" aria-modal="true" aria-labelledby="pdf-title"><h2 id="pdf-title">PDFの準備ができました</h2><p id="pdf-filename"></p><p class="pdf-guide">iPhoneでは「PDFを共有して保存」から「ファイルに保存」を選べます。</p><button id="pdf-share" type="button" class="secondary">PDFを共有して保存</button><a id="pdf-download">PDFをダウンロード</a><button id="pdf-open" type="button" class="secondary">PDFを開く</button><button id="pdf-close" type="button" class="secondary">閉じる</button><p id="pdf-message" role="status"></p></section>';
    document.body.append(dialog);
    document.getElementById('pdf-filename').textContent=filename;
    const download=document.getElementById('pdf-download');download.href=activePdf.url;download.download=filename;
    const file=new File([blob],filename,{type:'application/pdf'});
    const share=document.getElementById('pdf-share');
    share.hidden=!(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}));
    share.addEventListener('click',async()=>{
      try {await navigator.share({files:[file],title:filename});}
      catch(error){const message=document.getElementById('pdf-message');if(message)message.textContent=error.name==='AbortError'?'共有を取り消しました。':'共有できませんでした。「PDFを開く」かダウンロードをご利用ください。';}
    });
    document.getElementById('pdf-open').addEventListener('click',()=>{if(activePdf.namedUrl)window.open(activePdf.namedUrl,'_blank','noopener');else document.getElementById('pdf-download').click();});
    document.getElementById('pdf-close').addEventListener('click',()=>{const frame=frames[0];closePdf();frame?.focus();});
    dialog.addEventListener('keydown',event=>{if(event.key==='Escape')closePdf();});
    prepareNamedPdf(activePdf);
    (share.hidden?download:share).focus();
  }
  async function prepareNamedPdf(pdf){
    const worker=navigator.serviceWorker?.controller;if(!worker)return;
    const channel=new MessageChannel();
    const reply=new Promise(resolve=>{
      const timeout=setTimeout(()=>resolve(null),1500);
      channel.port1.onmessage=event=>{clearTimeout(timeout);resolve(event.data?.url||null);};
    });
    try{
      worker.postMessage({type:'timetable-hold-pdf',bytes:await pdf.blob.arrayBuffer(),filename:pdf.filename},[channel.port2]);
      const url=await reply;
      if(!url)return;
      const parsed=new URL(url),root=new URL('./',location.href);
      if(parsed.origin!==location.origin||!parsed.pathname.startsWith(root.pathname+'__pdf/'))return;
      if(activePdf!==pdf){worker.postMessage({type:'timetable-release-pdf',url});return;}
      pdf.namedUrl=url;const download=document.getElementById('pdf-download');
      if(download)download.href=url+'?download=1';
    }catch{}finally{channel.port1.close();}
  }
  function setBusy(value) {
    busy = value;
    input.disabled = value;
    toggle.disabled = value;
    submit.disabled = value;
    submit.textContent = value ? '確認しています…' : '時間割を開く';
    form.setAttribute('aria-busy', String(value));
  }
  function resetTimer() {
    clearTimeout(timer);
    if (frames.length) timer = setTimeout(() => lock('30分間操作がなかったため、ログアウトしました。'), IDLE_MS);
  }
  function createScreen(number) {
    const panel = document.createElement('section');
    panel.id = 'screen-' + number;
    panel.className = 'screen-panel';
    const heading = document.createElement('h2');
    heading.id = panel.id + '-heading';
    heading.className = 'screen-heading';
    heading.textContent = '時間割 ' + (number===1?'①':'②');
    panel.setAttribute('aria-labelledby', heading.id);
    const frame = document.createElement('iframe');
    frame.title = 'クラス・教員時間割検索（画面 ' + number + '）';
    frame.setAttribute('sandbox', 'allow-scripts');
    frame.setAttribute('referrerpolicy', 'no-referrer');
    frame.srcdoc = sessionHtml;
    panel.append(heading, frame);
    container.append(panel);
    frames.push(frame);
    return panel;
  }
  function setComparing(value) {
    if(!value)cancelPair();
    if (value && frames.length === 1) createScreen(2);
    if(value)createTools();
    if(!value&&toolsFrame)send(toolsFrame,{type:'timetable-request-tools'});
    toolsPanel.hidden=!value||!toolsFrame;
    const second = document.getElementById('screen-2');
    if (second) second.hidden = !value;
    app.classList.toggle('comparing', value);
    compare.setAttribute('aria-pressed', String(value));
    compare.textContent = value ? '1画面に戻す' : '2画面で比較';
    differences.hidden = !value;
    broadcastComparison();
    updateDisplayModes();
  }
  function lock(message = '') {
    generation++;
    cancelPair();
    clearTimeout(timer);
    container.replaceChildren();
    clearTools();
    frames = [];
    selections.clear();
    sessionHtml = '';
    preferenceSession = null;
    preferences = preferenceCrypto.empty();
    saveQueue = Promise.resolve();
    differenceOn = true;
    differences.setAttribute('aria-pressed','true');
    closePdf();
    setComparing(false);
    app.hidden = true;
    login.hidden = false;
    form.reset();
    input.type = 'password';
    toggle.textContent = '表示';
    toggle.setAttribute('aria-pressed', 'false');
    input.removeAttribute('aria-invalid');
    status.textContent = message;
    setBusy(false);
  }
  try {
    payload = JSON.parse(document.getElementById('encrypted-payload').textContent);
    if (payload === null) {
      status.textContent = '現在準備中です。';
      input.disabled = true;
      toggle.disabled = true;
      submit.disabled = true;
      return;
    }
    if (!globalThis.isSecureContext || !globalThis.crypto?.subtle) {
      throw new Error('Web Crypto unavailable');
    }
    input.disabled = false;
    toggle.disabled = false;
    submit.disabled = false;
  } catch {
    status.textContent = 'HTTPSで開き、最新のSafariまたはChromeをご利用ください。';
    submit.disabled = true;
    return;
  }
  toggle.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    toggle.textContent = show ? '隠す' : '表示';
    toggle.setAttribute('aria-pressed', String(show));
  });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (busy) return;
    const password = input.value;
    if (!password) {
      status.textContent = 'パスワードを入力してください。';
      input.focus();
      return;
    }
    const attempt = ++generation;
    input.value = '';
    input.removeAttribute('aria-invalid');
    status.textContent = '';
    setBusy(true);
    try {
      const html = await decryptHtml(payload, password);
      if (attempt !== generation) return;
      let stored = null;
      try {
        const value=localStorage.getItem(SAVED_KEY);
        if(value&&value.length<100000)stored=JSON.parse(value);
      } catch {}
      let restored;
      try {restored=await preferenceCrypto.open(password,stored);}
      catch {restored=await preferenceCrypto.open(password,null);}
      if(attempt!==generation)return;
      preferenceSession=restored;
      preferences=restored.preferences;
      sessionHtml = applyTimetablePresentation(html);
      container.replaceChildren();
      clearTools();
      selections.clear();
      frames = [];
      createScreen(1);
      setComparing(false);
      login.hidden = true;
      app.hidden = false;
      resetTimer();
    } catch {
      if (attempt === generation) {
        status.textContent = 'パスワードが違うか、ファイルが破損しています。';
        input.setAttribute('aria-invalid', 'true');
      }
    } finally {
      if (attempt === generation) {
        setBusy(false);
        if (!frames.length) input.focus();
      }
    }
  });
  compare.addEventListener('click', () => {
    if (!frames.length) return;
    setComparing(!app.classList.contains('comparing'));
    resetTimer();
  });
  pairButton.addEventListener('click',()=>{
    if(pairButton.disabled||pairPdf)return;
    pairPdf={id:crypto.randomUUID(),keys:frames.slice(0,2).map(frame=>selections.get(frame)),pages:[],items:[],exportedAt:Date.now()};
    updatePairControl();resetTimer();requestPairPage(1);
    pairTimer=setTimeout(()=>cancelPair('PDFを作成できませんでした。もう一度お試しください。'),45000);
  });
  differences.addEventListener('click',()=>{
    differenceOn=!differenceOn;
    differences.setAttribute('aria-pressed',String(differenceOn));
    broadcastComparison();
    resetTimer();
  });
  document.getElementById('home').addEventListener('click',()=>{
    if(!sessionHtml)return;
    cancelPair();closePdf();clearTools();container.replaceChildren();frames=[];selections.clear();
    differenceOn=true;differences.setAttribute('aria-pressed','true');
    const panel=createScreen(1);panel.querySelector('iframe').dataset.home='true';
    setComparing(false);window.scrollTo(0,0);resetTimer();
  });
  document.getElementById('logout').addEventListener('click', () => {
    lock('ログアウトしました。');
    input.focus();
  });
  window.addEventListener('message', event => {
    const frame=allFrames().find(frame=>event.source===frame.contentWindow);
    if(!frame||!event.data)return;
    const data=event.data;
    if(data.type==='timetable-activity')resetTimer();
    if(data.type==='timetable-feature-ready'){send(frame,{type:'timetable-preferences',preferences});broadcastComparison();}
    if(frame!==toolsFrame&&data.type==='timetable-selection'&&typeof data.key==='string'&&data.key.length<300){if(data.key==='')selections.delete(frame);else if(/^(teacher|class):/.test(data.key))selections.set(frame,data.key);else return;if(pairPdf&&selections.get(frame)!==pairPdf.keys[frames.indexOf(frame)])cancelPair('時間割が変わりました。もう一度PDF保存を押してください。');broadcastComparison();}
    if(data.type==='timetable-ui-ready'){
      if(frame===toolsFrame){
        toolsReady=true;send(frame,{type:'timetable-display-mode',mode:'tools'});
        if(pendingTools)send(frame,{type:'timetable-restore-tools',state:pendingTools});
        syncTools();
      }else{
        updateDisplayModes();
        if(frame.dataset.home==='true'){delete frame.dataset.home;send(frame,{type:'timetable-home'});}
      }
    }
    if(data.type==='timetable-frame-height'&&app.classList.contains('comparing')){
      const h=data.height;
      if(Number.isFinite(h)&&h>=0&&h<=12000)frame.style.height=Math.max(frame===toolsFrame?0:200,Math.ceil(h))+'px';
    }
    if(data.type==='timetable-tool-state'){
      if(frame===toolsFrame&&!app.classList.contains('comparing'))send(frames[0],{type:'timetable-restore-tools',state:data.state});
      if(frame===frames[0]&&app.classList.contains('comparing')){
        pendingTools=data.state;if(toolsReady)send(toolsFrame,{type:'timetable-restore-tools',state:pendingTools});
      }
    }
    if(frame===toolsFrame&&data.type==='timetable-tool-open'&&typeof data.key==='string'&&/^(teacher|class):/.test(data.key))send(frames[0],{type:'timetable-open-selection',key:data.key});
    if(data.type==='timetable-save')savePreferences(data.change);
    if(data.type==='timetable-pdf-error'&&pairPdf?.id===data.requestId)cancelPair('PDFを作成できませんでした。もう一度お試しください。');
    if(data.type==='timetable-pdf-page'&&pairPdf?.id===data.requestId){
      const number=pairPdf.pages.length+1,page=validateRaster(data);
      if(frame!==frames[number-1]||data.pageNumber!==number||data.item?.key!==pairPdf.keys[number-1])return;
      if(!page){cancelPair('PDFを作成できませんでした。もう一度お試しください。');return;}
      pairPdf.pages.push(page);pairPdf.items.push(data.item);
      if(number===1)requestPairPage(2);
      else{
        const job=pairPdf,filename=pdfFilename(job.items,job.exportedAt);
        cancelPair();showPdfFile(makeTimetablePdf(null,{pages:job.pages,title:filename.replace(/\.pdf$/,'')}),filename);
        pairStatus.textContent='2ページのPDFを作成しました。';
      }
    }
    if(data.type==='timetable-pdf'){cancelPair();showPdf(data);}
  });
  for (const type of ['pointerdown', 'keydown']) {
    window.addEventListener(type, () => { if (frames.length) resetTimer(); }, {passive: true});
  }
  window.addEventListener('pagehide', () => lock());
  window.addEventListener('pageshow', event => { if (event.persisted) lock(); });
})();

;(() => {
  'use strict';
  let installPrompt=null;
  const buttons=[document.getElementById('install-login'),document.getElementById('install-app')].filter(Boolean);
  const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  function updateInstall(){for(const button of buttons)button.hidden=standalone();}
  updateInstall();
  matchMedia('(display-mode: standalone)').addEventListener?.('change',updateInstall);
  window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;updateInstall();});
  window.addEventListener('appinstalled',()=>{installPrompt=null;for(const button of buttons)button.hidden=true;document.getElementById('install-dialog')?.remove();});
  function guide(){
    if(document.getElementById('install-dialog'))return;
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    const dialog=document.createElement('div');dialog.id='install-dialog';dialog.className='pdf-dialog';
    const section=document.createElement('section');section.className='pdf-card';section.setAttribute('role','dialog');section.setAttribute('aria-modal','true');section.setAttribute('aria-labelledby','install-title');
    const title=document.createElement('h2');title.id='install-title';title.textContent='ホーム画面に追加';
    const text=document.createElement('p');text.textContent=ios?'ブラウザの共有ボタン →「ホーム画面に追加」→「追加」を選んでください。':'ブラウザのメニューから「ホーム画面に追加」または「アプリをインストール」を選んでください。';
    const note=document.createElement('p');note.textContent='一度オンラインで開くと、通信できないときも時間割を開けます。閲覧には毎回パスワードが必要です。';
    const close=document.createElement('button');close.className='secondary';close.textContent='閉じる';close.type='button';
    close.addEventListener('click',()=>dialog.remove());dialog.addEventListener('keydown',event=>{if(event.key==='Escape')dialog.remove();});
    section.append(title,text,note,close);dialog.append(section);document.body.append(dialog);close.focus();
  }
  for(const button of buttons)button.addEventListener('click',async()=>{
    document.getElementById('app-menu')?.removeAttribute('open');
    if(!installPrompt){guide();return;}
    const prompt=installPrompt;installPrompt=null;
    try{await prompt.prompt();const result=await prompt.userChoice;if(result?.outcome==='accepted')for(const b of buttons)b.hidden=true;}
    catch{guide();}
  });
  const offline=document.getElementById('offline-status');
  function connection(){offline.hidden=navigator.onLine;offline.textContent=navigator.onLine?'':'オフライン：この端末に保存した時間割を表示します。';}
  window.addEventListener('online',connection);window.addEventListener('offline',connection);connection();
  if(!('serviceWorker' in navigator)||!isSecureContext)return;
  navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'})
    .then(()=>navigator.serviceWorker.ready)
    .then(()=>{const note=document.getElementById('offline-ready');if(note)note.textContent='通信できないときも、この端末で時間割を開けます。';})
    .catch(()=>{const note=document.getElementById('offline-ready');if(note)note.textContent='ホーム画面に追加すると、次回からすぐに開けます。';});
})();
