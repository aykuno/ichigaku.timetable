<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow,nosnippet">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-@@GATE_HASH@@' @@CONTENT_HASHES@@; style-src 'unsafe-inline'; frame-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#2d5bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="時間割検索">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<title>時間割検索｜ログイン</title>
<style>
:root{color-scheme:light;--bg:#f6f7fb;--text:#1b2233;--muted:#5e6a85;--accent:#2d5bff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text)}
#login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:22px}
.card{width:min(100%,420px);padding:30px 26px;background:#fff;border:1px solid #d7dbe7;border-radius:18px;box-shadow:0 10px 30px rgba(28,42,89,.07)}
.password-notice{margin:0 0 18px;padding:11px 12px;border:1px solid #b9c9ff;border-radius:10px;background:#eef3ff;color:#234bc5;font-size:14px;font-weight:700;line-height:1.6}
h1{font-size:23px;margin:0 0 10px}
.description{font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 25px}
label{font-size:14px;font-weight:700}
.password-row{display:flex;margin-top:8px;gap:8px}
input{min-width:0;flex:1;height:46px;border:1px solid #b8c0d6;border-radius:10px;padding:0 12px;font-size:16px}
button{font:inherit;cursor:pointer;border-radius:10px}
button:disabled{cursor:wait;opacity:.65}
.secondary{border:1px solid #b8c0d6;background:#fff;color:var(--text);padding:0 12px}
#unlock{width:100%;margin-top:17px;height:46px;background:var(--accent);color:#fff;border:0;font-weight:700}
#status{margin:15px 0 0;min-height:2.8em;font-size:13px;line-height:1.6;color:#ad2238}
.private-note{margin:6px 0 0;font-size:12px;line-height:1.6;color:var(--muted)}
 .app-bar{min-height:56px;padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-bottom:1px solid #d7dbe7;position:sticky;top:0;z-index:1}
.app-bar .app-title{font-size:14px;font-weight:700;white-space:nowrap}
.app-actions{display:flex;flex-wrap:wrap;gap:8px;max-width:100%}
.app-actions button{padding:8px 10px;font-size:13px;white-space:nowrap}
#compare[aria-pressed="true"]{border-color:var(--accent);background:#eef3ff;color:#263a74}
#frame-container{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;background:#d7dbe7}
.screen-panel{min-width:0;background:var(--bg)}
.screen-heading{display:none;height:32px;margin:0;padding:0 14px;align-items:center;font-size:13px;font-weight:700;color:var(--muted);background:#fff;border-bottom:1px solid #d7dbe7}
iframe{display:block;width:100%;height:calc(100vh - var(--bar-height,56px));height:calc(100dvh - var(--bar-height,56px));border:0;background:var(--bg)}
#app.comparing #frame-container{grid-template-columns:repeat(2,minmax(0,1fr))}
#app.comparing .screen-heading{display:flex}
#app.comparing iframe{height:calc(100vh - var(--bar-height,56px) - 32px);height:calc(100dvh - var(--bar-height,56px) - 32px)}
@media(max-width:760px){#app.comparing #frame-container{grid-template-columns:minmax(0,1fr)}}
.pdf-dialog{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(20,30,55,.5)}
.pdf-card{background:#fff;border-radius:16px;padding:22px;max-width:440px;width:100%;display:grid;gap:10px}
.pdf-card h2{font-size:18px;margin:0}
.pdf-card p{font-size:13px;line-height:1.6;margin:0;word-break:break-word}
.pdf-card button,.pdf-card a{padding:11px;text-align:center;font-size:14px;border-radius:10px}
.pdf-card a{background:var(--accent);color:#fff;text-decoration:none}
:focus-visible{outline:3px solid #90a8ff;outline-offset:3px}

#home{border:0;background:transparent;color:var(--text);padding:7px 0;text-align:left}
#home:hover{color:var(--accent)}
#shared-tools{padding:8px;background:var(--bg);border-bottom:1px solid #d7dbe7}
#shared-tools iframe{height:136px}
#app.comparing #frame-container{align-items:start;gap:8px;padding:8px;background:var(--bg)}
#app.comparing iframe{height:900px}
#app.comparing .screen-panel{border:1px solid #d7dbe7;border-radius:12px;overflow:hidden}
#app.comparing .screen-heading{height:30px}
#app-menu{position:relative}
#app-menu summary{list-style:none;cursor:pointer;padding:6px 9px;font-size:20px;line-height:1;border:1px solid #b8c0d6;border-radius:9px}
#app-menu summary::-webkit-details-marker{display:none}
.app-menu-body{position:absolute;right:0;top:calc(100% + 6px);padding:8px;background:#fff;box-shadow:0 6px 20px #1b223322;border:1px solid #d7dbe7;border-radius:10px;z-index:3;width:190px}
.app-menu-body button{width:100%;font-size:12px}
.install-login{display:block;padding:8px 10px;margin-top:16px;font-size:13px}
#offline-status{margin:0;padding:7px 12px;font-size:12px;background:#fff4cf;color:#805700}
@media(max-width:760px){
 .app-bar{padding:6px 8px;gap:5px;flex-wrap:nowrap}
 .app-bar .app-title{font-size:12px}
 .app-actions{gap:4px;flex-wrap:nowrap}
 .app-actions button{font-size:11px;padding:7px 6px}
 #app-menu summary{padding:5px 6px;font-size:18px}
 #app.comparing #frame-container{padding:5px;gap:8px}
 #shared-tools{padding:5px}
}
#comparison-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:7px 10px;background:var(--bg)}
#comparison-pdf{padding:9px 12px;font-size:13px;color:#234bc5;border-color:#5477ef;background:#f1f5ff;font-weight:700}
#comparison-pdf:disabled{cursor:default;opacity:.5}
#comparison-pdf-status{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main id="login">
  <section class="card" aria-labelledby="login-title">
    <p class="password-notice">パスワードは、今までと同じです</p>
    <h1 id="login-title">時間割検索</h1>
    <p class="description">閲覧にはパスワードが必要です。<br>案内されたパスワードを入力してください。</p>
    <form id="login-form" action="#" autocomplete="off">
      <label for="password">パスワード</label>
      <div class="password-row">
        <input id="password" type="password" disabled required autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="status">
        <button id="show-password" class="secondary" type="button" disabled aria-pressed="false" aria-controls="password">表示</button>
      </div>
      <button id="unlock" type="submit" disabled>時間割を開く</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="private-note">パスワードや時間割を外部に共有しないでください。<br>30分間操作がない場合は、自動でログアウトします。</p>
    <noscript><p>このサイトの利用にはJavaScriptを有効にしてください。</p></noscript>
    <button id="install-login" class="secondary install-login" type="button">ホーム画面に追加</button>
    <p id="offline-ready" class="private-note"></p>
  </section>
</main>
<p id="offline-status" role="status" hidden></p>
<section id="app" hidden>
  <div class="app-bar">
    <button id="home" class="app-title" type="button" aria-label="ホームに戻る">時間割検索</button>
    <div class="app-actions">
      <button id="compare" class="secondary" type="button" aria-pressed="false" aria-controls="frame-container">2画面で比較</button>
      <button id="differences" class="secondary" type="button" aria-pressed="true" hidden>差分表示</button>
      <button id="logout" class="secondary" type="button">ログアウト</button>
      <details id="app-menu"><summary aria-label="メニュー">⋯</summary><div class="app-menu-body"><button id="install-app" class="secondary" type="button">ホーム画面に追加</button></div></details>
    </div>
  </div>
  <section id="shared-tools" aria-label="比較で共通の検索ツール" hidden></section>
  <div id="comparison-actions" hidden><button id="comparison-pdf" class="secondary" type="button" disabled>2つの時間割をPDF保存</button><span id="comparison-pdf-status" role="status"></span></div>
  <div id="frame-container"></div>
</section>
<script id="encrypted-payload" type="application/json">@@PAYLOAD@@</script>
<script>@@GATE_SCRIPT@@</script>
</body>
</html>
