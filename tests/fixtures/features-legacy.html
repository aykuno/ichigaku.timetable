function toHiragana(str){return String(str||'').replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));}
function searchNorm(str){return toHiragana(String(str||'')).toLowerCase().replace(/[\s　]+/g,'').trim();}
const GROUP_READINGS={"確認部":["かくにんぶ"]};
const GROUP_ALIASES=GROUP_READINGS;
const ROLE_SUFFIXES=['副委員長','委員長','副部長','部長','副主任','主任','担当','総括'];
function stripParenText(text){return String(text||'').replace(/[（(].*?[）)]/g,'');}
function stripRoleSuffix(text){
  let s=stripParenText(text).trim();
  let changed=true;
  while(changed){
    changed=false;
    for(const suffix of ROLE_SUFFIXES){
      if(s.endsWith(suffix)){
        s=s.slice(0,-suffix.length).trim();
        changed=true;
        break;
      }
    }
  }
  return s;
}
function labelsForGroupName(groupName){
  return [groupName].concat(GROUP_READINGS[groupName]||[]);
}
function labelsForDuty(text){
  const raw=String(text||'');
  const bases=unique([raw,stripParenText(raw),stripRoleSuffix(raw)].filter(Boolean));
  const labels=[raw];
  bases.forEach(base=>{
    labels.push(base);
    if(GROUP_READINGS[base]) labels.push(...labelsForGroupName(base));
  });
  Object.keys(GROUP_READINGS).forEach(groupName=>{
    if(bases.some(base=>base.includes(groupName)||groupName.includes(base))){
      labels.push(...labelsForGroupName(groupName));
    }
  });
  ROLE_SUFFIXES.forEach(role=>{
    if(raw.includes(role)) labels.push(role,...(GROUP_READINGS[role]||[]));
  });
  return unique(labels);
}
function dutyTextsOf(name){
  return (DUTIES[name]||[]).map(d=>d&&d.t).filter(Boolean);
}
function searchableDutyTextForTeacher(name){
  return dutyTextsOf(name).flatMap(labelsForDuty).join(' ');
}
function matchedDutiesForTeacher(name,query){
  const q=normalize(query);
  if(!q)return [];
  return dutyTextsOf(name).filter(t=>{
    return labelsForDuty(t).some(label=>{
      const n=normalize(label);
      return n && (n.includes(q) || (q.length>=3 && q.includes(n)));
    });
  });
}
function roleRankFromDutyText(text){
  const t=String(text||'');
  if(t.includes('副部長')||t.includes('副委員長')) return 1;
  if(t.includes('部長')||t.includes('委員長')) return 0;
  return 2;
}
function bestRoleRankForQuery(name,query){
  const matched=matchedDutiesForTeacher(name,query);
  if(!matched.length) return 2;
  return Math.min(...matched.map(roleRankFromDutyText));
}
function unique(arr){return Array.from(new Set(arr));}
const ITEMS=DATA.items.map((x,idx)=>{const kind=x.k==='t'?'teacher':'class'; const reading=kind==='teacher'?(READINGS[x.n]||''):''; const dutySearch=kind==='teacher'?searchableDutyTextForTeacher(x.n):''; return {...x,idx,kind,reading,key:(kind)+':'+x.n,search:searchNorm([x.n,reading,(kind==='teacher'?'教職員':'クラス'),x.s,dutySearch].join(' '))};});
function kindLabel(kind){return kind==='teacher'?'教職員':'クラス'}

function normalize(s){return searchNorm(s)}
function classQueryInfo(query){
  const q=normalize(query);
  const m=q.match(/^(\d+-\d+)(理|文)?$/);
  return m?{q,base:m[1]}:null;
}
function isClassNameQuery(query){return !!classQueryInfo(query)}
function matchedClassDutiesForTeacher(name,query){
  const info=classQueryInfo(query);
  if(!info)return [];
  const exact=matchedDutiesForTeacher(name,info.q);
  const base=info.base!==info.q?matchedDutiesForTeacher(name,info.base):[];
  return unique(exact.concat(base));
}
function matches(item){
  const q=normalize(state.query);
  if(!q)return true;
  if(item.search.includes(q))return true;
  // クラス名検索では、クラス表に紐づく担任・副担任を必ず候補に含める。
  if(item.kind==='teacher'&&isClassNameQuery(state.query)){
    return item.n===HOMEROOMS[q]||item.n===VICE_HOMEROOMS[q];
  }
  return false;
}
function parseClassParts(name){
  const m=String(name||'').match(/^(\d+)-(\d+)(.*)$/);
  if(!m) return {g:999,c:999,s:String(name||'')};
  return {g:parseInt(m[1],10),c:parseInt(m[2],10),s:m[3]||''};
}
function classSearchRank(item,query){
  if(item.kind==='class') return 0;
  if(item.kind!=='teacher') return 3;
  const q=normalize(query);
  if(item.n===HOMEROOMS[q]) return 1;
  if(item.n===VICE_HOMEROOMS[q]) return 2;
  return 3;
}
function compareItems(a,b){
  const q=normalize(state.query);
  const classQuery=isClassNameQuery(state.query);

  // クラス名検索時は「クラス時間割 → 担任 → 副担任」の順にする。
  if(classQuery){
    const arank=classSearchRank(a,state.query);
    const brank=classSearchRank(b,state.query);
    if(arank!==brank) return arank-brank;
  }else if(a.kind!==b.kind){
    return a.kind==='teacher'?-1:1;
  }

  if(a.kind==='teacher'&&b.kind==='teacher'){
    if(q&&!classQuery){
      const arank=bestRoleRankForQuery(a.n,state.query);
      const brank=bestRoleRankForQuery(b.n,state.query);
      if(arank!==brank) return arank-brank;
    }
    const ar=normalize(a.reading||a.n);
    const br=normalize(b.reading||b.n);
    return ar.localeCompare(br,'ja') || a.n.localeCompare(b.n,'ja');
  }
  if(a.kind==='class'&&b.kind==='class'){
    const pa=parseClassParts(a.n), pb=parseClassParts(b.n);
    return (pa.g-pb.g) || (pa.c-pb.c) || pa.s.localeCompare(pb.s,'ja');
  }
  return a.kind==='class'?-1:1;
}
function filteredItems(){
  const arr=ITEMS.filter(matches);
  arr.sort(compareItems);
  return arr
}

}

function compactSubjectText(s){return String(s||'').replace(/\n/g,'').replace(/[ 　]/g,'').trim();}
function subjectCategoriesFromText(s){
  const t=compactSubjectText(s);
  const n=searchNorm(t);
  const cats=new Set();
  if(!t||t==='✕'||t==='ＩＣＲ') return cats;
  if(/英語|英会話|英コミュ|論理・表現|Writing|Reading|プレ英/i.test(t) || /writing|reading/i.test(t)) cats.add('英語');
  if(/数学|数式|図形/.test(t)) cats.add('数学');
  if(/国語|言語文化|文学国語|現代文|古典|構造読解/.test(t)) cats.add('国語');
  if(/物理/.test(t)) cats.add('物理');
  if(/化学/.test(t)) cats.add('化学');
  if(/生物/.test(t)) cats.add('生物');
  if(/地学/.test(t)) cats.add('地学');
  if(/理科|SSH/.test(t)) cats.add('理科');
  if(/地理/.test(t)) cats.add('地理');
  if(/歴史|世界史|日本史/.test(t)) cats.add('歴史');
  if(/公民|公共/.test(t)) cats.add('公民');
  if(/社会/.test(t)) cats.add('社会');
  if(/家庭/.test(t)) cats.add('家庭');
  if(/情報/.test(t)) cats.add('情報');
  if(/技術/.test(t)) cats.add('技術');
  if(/保健体育|体育|保健|ダンス|剣道/.test(t)) cats.add('保健体育');
  if(/芸術|音楽|美術|書道/.test(t)) cats.add('芸術');
  if(/道徳/.test(t)) cats.add('道徳');
  if(/LHR/.test(t)) cats.add('LHR');
  if(/LAゼミ|ゼミ/.test(t) || n.includes('えるえーぜみ')) cats.add('ゼミ');
  if(!cats.size) cats.add(n || t);
  return cats;
}
function expandedQueryCategories(q){
  const cats=subjectCategoriesFromText(q);
  const n=searchNorm(q);
  if(n==='えいご'||n==='english') cats.add('英語');
  if(n==='すうがく'||n==='math') cats.add('数学');
  if(n==='こくご') cats.add('国語');
  if(n==='りか') cats.add('理科');
  if(n==='しゃかい') cats.add('社会');
  if(n==='かてい'||n==='かていか') cats.add('家庭');
  if(n==='じょうほう') cats.add('情報');
  if(n==='たいいく'||n==='ほけんたいいく') cats.add('保健体育');
  return cats;
}
function subjectMatchesForLesson(top,query){
  const topText=compactSubjectText(top);
  if(!topText||topText==='✕'||topText==='ＩＣＲ') return false;
  const q=compactSubjectText(query);
  if(!q) return true;
  const topNorm=searchNorm(topText), qNorm=searchNorm(q);
  if(topNorm.includes(qNorm)) return true;
  const cellCats=subjectCategoriesFromText(topText);
  const qCats=expandedQueryCategories(q);
  const scienceBroad=['理科','物理','化学','生物','地学'];
  const socialBroad=['社会','地理','歴史','公民'];
  for(const qc of qCats){
    if(qc==='理科' && scienceBroad.some(c=>cellCats.has(c))) return true;
    if(qc==='社会' && socialBroad.some(c=>cellCats.has(c))) return true;
    if(cellCats.has(qc)) return true;
  }
  return false;
}
function lessonConditionResults(){

    if(!subjectMatchesForLesson(top,subject)) return null;
    return {item,top,bottom,dayIdx,periodIdx};
  }).filter(Boolean).sort((a,b)=>compareItems(a.item,b.item));
}

    }));
    byId('clock-level').value=clockLevel;
    byId('clock-level').addEventListener('change',event=>{clockLevel=event.target.value;refreshNow();});
    byId('clock-edit').addEventListener('click',()=>{byId('clock-tools').open=true;byId('bell-mode').value=clockLevel;loadBellForm();byId('clock-tools').scrollIntoView({block:'start'});});
    byId('favorite-toggle').addEventListener('click',()=>{
      prefs.favorites=prefs.favorites.includes(item.key)?prefs.favorites.filter(k=>k!==item.key):[...prefs.favorites,item.key];
      renderQuick();persist({type:'favorite',key:item.key,enabled:prefs.favorites.includes(item.key)});
    });
    byId('timetable-pdf').addEventListener('click',()=>exportTimetablePdf(item));
    refreshNow();refreshDifference();renderQuick();
    post({type:'timetable-selection',key:item.key});recordVisit(item.key);
  };
  function wrapCanvasText(ctx,text,maxWidth) {
    const lines=[];
    for(const paragraph of String(text||'').split('\n')){
      let line='';
      for(const char of paragraph){if(line&&ctx.measureText(line+char).width>maxWidth){lines.push(line);line='';}line+=char;}
      lines.push(line);
    }
    return lines;
  }
  async function exportTimetablePdf(item){
    const status=byId('pdf-status'),button=byId('timetable-pdf');
    button.disabled=true;status.textContent='PDFを作成しています…';
    try{
      if(document.fonts?.ready)await document.fonts.ready;
      const canvas=document.createElement('canvas');canvas.width=1240;canvas.height=1754;
      const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas unavailable');
      const font=(size,weight)=>{ctx.font=(weight||'400')+' '+size+'px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,"Noto Sans CJK JP",sans-serif';};
      ctx.fillStyle='#fff';ctx.fillRect(0,0,1240,1754);ctx.textBaseline='top';
      ctx.fillStyle='#1b2233';font(24,'700');ctx.fillText('2026年度 時間割',60,54);
      font(42,'700');ctx.fillText(item.n+(item.kind==='teacher'?' 先生':''),60,96);
      font(18);ctx.fillStyle='#5e6a85';ctx.fillText('教員別 ver2.1 / クラス別 ver3.2',60,154);
      const metadata=item.kind==='teacher'?['担当科目：'+profile(item).subjects.join(' / '),'担当クラス：'+profile(item).classes.join(' / '),'所属・役職：'+dutyTextsOf(item.n).join(' / '),(STATUS_TEXTS[item.n]|| (REST_DAYS[item.n]?'指定休：'+REST_DAYS[item.n]:''))]:['担任：'+(HOMEROOMS[item.n]||'未登録'),'副担任：'+(VICE_HOMEROOMS[item.n]||'未登録')];
      let metaY=190;font(18);
      for(const text of metadata){if(!text)continue;const lines=wrapCanvasText(ctx,text,1120).slice(0,2);for(const line of lines){if(metaY>330)break;ctx.fillText(line,60,metaY);metaY+=24;}}
      const x=60,y=390,periodWidth=70,colWidth=175,rowHeight=146,headerHeight=52;
      function box(bx,by,bw,bh,color){ctx.fillStyle=color;ctx.fillRect(bx,by,bw,bh);ctx.strokeStyle='#b8c0d6';ctx.lineWidth=1.5;ctx.strokeRect(bx,by,bw,bh);}
      box(x,y,periodWidth,headerHeight,'#eef2fa');
      font(24,'700');ctx.fillStyle='#1b2233';ctx.textAlign='center';ctx.fillText('限',x+periodWidth/2,y+12);
      for(let d=0;d<6;d++){box(x+periodWidth+d*colWidth,y,colWidth,headerHeight,'#eef2fa');ctx.fillStyle='#1b2233';ctx.fillText(DAYS[d],x+periodWidth+(d+.5)*colWidth,y+12);}
      function cellText(text,cx,cy,maxHeight,size,weight,color){
        let lines;
        do{font(size,weight);lines=wrapCanvasText(ctx,text,colWidth-16);if(lines.length*size*1.2<=maxHeight||size<=12)break;size--;}while(size>12);
        ctx.fillStyle=color;const lineHeight=size*1.2;
        lines.forEach((line,i)=>ctx.fillText(line,cx,cy+i*lineHeight));
      }
      for(let p=0;p<7;p++){
        const ry=y+headerHeight+p*rowHeight;
        box(x,ry,periodWidth,rowHeight,'#eef2fa');font(26,'700');ctx.fillStyle='#1b2233';ctx.fillText(PERIODS[p],x+periodWidth/2,ry+58);
        for(let d=0;d<6;d++){
          const cell=cellData(item,p,d)||{top:'',bottom:'',color:'#fff'},cx=x+periodWidth+d*colWidth;
          box(cx,ry,colWidth,rowHeight,normalizeCellColor(cell.top,cell.color));
          cellText(cell.top,cx+colWidth/2,ry+12,64,24,'700','#1b2233');
          cellText(cell.bottom,cx+colWidth/2,ry+82,54,20,'400','#374151');
        }
      }
      font(17);ctx.textAlign='left';ctx.fillStyle='#5e6a85';ctx.fillText('上段：科目等 / 下段：担当・クラス',60,1500);
      ctx.fillText('このPDFを外部に共有しないでください。',60,1530);
      ctx.textAlign='center';ctx.fillText('1',620,1674);
      const jpeg=await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('JPEG encoding failed')),'image/jpeg',0.95));
      const bytes=await jpeg.arrayBuffer();
      post({type:'timetable-pdf',bytes,filename:'時間割_'+item.n.replace(/[\\/:*?"<>|]/g,'_')+'.pdf'});
      status.textContent='PDFの保存画面を開きました。';
    }catch{status.textContent='PDFを作成できませんでした。もう一度お試しください。';}
    finally{if(button.isConnected)button.disabled=false;}
  }
  window.addEventListener('message',event=>{
    if(event.source!==parent||!event.data)return;
    const data=event.data;
    if(data.type==='timetable-preferences'){
      const bellsChanged=JSON.stringify(prefs.bells)!==JSON.stringify(data.preferences?.bells||{});
      prefs={favorites:Array.isArray(data.preferences?.favorites)?data.preferences.favorites:[],recent:Array.isArray(data.preferences?.recent)?data.preferences.recent:[],bells:data.preferences?.bells||{}};
      const first=!prefsReady;prefsReady=true;renderQuick();if(first||bellsChanged)loadBellForm();refreshNow();
      if(first&&current())recordVisit(current().key);
    }
    if(data.type==='timetable-comparison'){
      peer=ITEMS.find(x=>x.key===data.key)||null;differenceEnabled=!!data.enabled;refreshDifference();
    }
    if(data.type==='timetable-storage-status')byId('saved-status').textContent=data.message;
  });
  new MutationObserver(()=>{if(!current())post({type:'timetable-selection',key:''});}).observe(viewerEl,{childList:true});
  if(current())renderViewer(current());
  post({type:'timetable-feature-ready'});
  setInterval(refreshNow,30000);
})();
</script></body></html>
