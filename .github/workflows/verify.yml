name: Verify password protection

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify encryption and public files
        run: npm test
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Verify password gate in browsers
        run: npm run test:browser
      - name: Verify timetable application in desktop and mobile browsers
        run: npm run test:timetable
